[package]
name = "shared-logging"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["Kelley Blackmore <kelleyblackmore@gmail.com>"]
description = "Structured logging library with context propagation, redaction, and HTTP middleware"
license = "MIT"
repository = "https://github.com/kelleyblackmore/shared-logging"
keywords = ["logging", "structured-logging", "tracing", "observability", "redaction"]
categories = ["development-tools"]
readme = "README.md"

[lib]
name = "shared_logging"
path = "src/lib.rs"

[dependencies]
# Core logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Context propagation
uuid = { version = "1.29", features = ["v4", "serde"] }

# HTTP middleware (tower is framework-agnostic, optional)
tower = { version = "0.5.3", optional = true }
http = { version = "1.5", optional = true }

# OpenTelemetry (optional)
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }

# Error handling
thiserror = "2.0"

# Time handling
chrono = "0.4.45"

# Regex for redaction patterns
regex = "1.13"

[dev-dependencies]
tokio = { version = "1.54", features = ["full"] }
axum = "0.8"
tower = "0.5.3"
tower-http = { version = "0.7", features = ["trace"] }

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "http_server"
path = "examples/http_server.rs"
required-features = ["http"]

[[example]]
name = "error_handling"
path = "examples/error_handling.rs"

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
http = ["dep:tower", "dep:http"]

